<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Surat Spesial</title>
    <!-- CDN SDK Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #080d1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .editor-card {
            background: #161f33;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff7675;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #ccc;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        /* PILIHAN WARNA AMPLOP */
        .color-options {
            display: flex;
            gap: 12px;
            margin-top: 5px;
        }

        .color-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: #ffffff;
            transform: scale(1.15);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .color-white  { background-color: #ffffff; }
        .color-pink   { background-color: #f08080; }
        .color-blue   { background-color: #5d9cec; }
        .color-red    { background-color: #e74c3c; }
        .color-purple { background-color: #9b59b6; }

        /* PILIHAN CUSTOM PIN / EMOJI */
        .pin-options {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .pin-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #334155;
            background: #0f172a;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .pin-btn:hover {
            transform: scale(1.1);
        }

        .pin-btn.active {
            border-color: #ff7675;
            background: #1e293b;
            transform: scale(1.15);
            box-shadow: 0 0 10px rgba(255, 118, 117, 0.4);
        }

        .file-input {
            font-size: 0.85rem;
            color: #aaa;
        }

        .img-preview {
            margin-top: 10px;
            max-height: 120px;
            border-radius: 8px;
            display: none;
            object-fit: contain;
            border: 1px dashed #475569;
        }

        /* TOMBOL SELESAI */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff7675, #d63031);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .btn-submit:disabled {
            background: #555;
            cursor: not-allowed;
        }

        /* RESULT POPUP / LINK BOX */
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            display: none;
        }

        .result-box label {
            color: #4ade80;
            font-weight: bold;
        }

        .link-container {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .link-container input {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .btn-copy {
            padding: 8px 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: bold;
        }

        .loading-text {
            font-size: 0.85rem;
            color: #f1c40f;
            margin-top: 8px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="editor-card">
        <h2>💌 Buat Surat Spesial</h2>

        <!-- Judul Surat -->
        <div class="form-group">
            <label for="title">Judul Surat / Panggilan:</label>
            <input type="text" id="title" placeholder="Contoh: Halo Kamu! ❤️" value="Halo Kamu! ❤️">
        </div>

        <!-- Isi Pesan Teks -->
        <div class="form-group">
            <label for="message">Isi Surat (Teks):</label>
            <textarea id="message" placeholder="Tulis pesan manismu di sini...">BOOM! 🚀 Suratnya melompat lurus ke depan mendatangi layarmu!</textarea>
        </div>

        <!-- Upload Gambar PNG -->
        <div class="form-group">
            <label for="imageInput">Upload Gambar (Opsional):</label>
            <input type="file" id="imageInput" accept="image/png, image/jpeg" class="file-input">
            <img id="imgPreview" class="img-preview" alt="Preview Gambar">
        </div>

        <!-- Pilih Warna Amplop -->
        <div class="form-group">
            <label>Pilih Warna Amplop:</label>
            <div class="color-options">
                <button type="button" class="color-btn color-pink active" data-color="pink" title="Pink"></button>
                <button type="button" class="color-btn color-white" data-color="white" title="Putih"></button>
                <button type="button" class="color-btn color-blue" data-color="blue" title="Biru"></button>
                <button type="button" class="color-btn color-red" data-color="red" title="Merah"></button>
                <button type="button" class="color-btn color-purple" data-color="purple" title="Ungu"></button>
            </div>
        </div>

        <!-- Pilih Custom Pin / Segel Amplop -->
        <div class="form-group">
            <label for="customPinInput">Pilih atau Ketik Custom Pin/Stiker:</label>
            <div class="pin-options" id="pinPresetContainer">
                <button type="button" class="pin-btn active" data-pin="❤️">❤️</button>
                <button type="button" class="pin-btn" data-pin="🎀">🎀</button>
                <button type="button" class="pin-btn" data-pin="⭐">⭐</button>
                <button type="button" class="pin-btn" data-pin="🌸">🌸</button>
                <button type="button" class="pin-btn" data-pin="👑">👑</button>
                <button type="button" class="pin-btn" data-pin="🐱">🐱</button>
            </div>
            <input type="text" id="customPinInput" placeholder="Atau ketik 1 emoji/huruf sendiri..." maxlength="4" style="margin-top: 10px;">
        </div>

        <button type="button" class="btn-submit" id="btnGenerate">Selesai & Buat Link Surat</button>
        <div class="loading-text" id="loadingText">⏳ Menyimpan surat ke Database...</div>

        <!-- Box Link Hasil -->
        <div class="result-box" id="resultBox">
            <label>✨ Link Ringkas Siap Dikirim!</label>
            <div class="link-container">
                <input type="text" id="generatedLink" readonly>
                <button type="button" class="btn-copy" id="btnCopy">Salin Link</button>
            </div>
        </div>
    </div>

    <script>
       // 1. INISIALISASI SUPABASE (Ganti nama variabel jadi supabaseClient)
        const supabaseUrl = 'https://npyscrwasomskilhxxkx.supabase.co'; 
        const supabaseKey = 'sb_publishable_U5o5MEG7gyNsUuCvkEhxUw_oFcjxxBv'; 
        
        // Menggunakan window.supabase agar tidak bentrok
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let selectedColor = 'pink';
        let selectedPin = '❤️';
        let imageBase64 = '';

        // Handle Pilih Warna Amplop
        const colorBtns = document.querySelectorAll('.color-btn');
        colorBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                colorBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedColor = btn.getAttribute('data-color');
            });
        });

        // Handle Pilih Custom Pin Preset
        const pinBtns = document.querySelectorAll('.pin-btn');
        const customPinInput = document.getElementById('customPinInput');

        pinBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                pinBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedPin = btn.getAttribute('data-pin');
                customPinInput.value = '';
            });
        });

        customPinInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            if (val) {
                pinBtns.forEach(b => b.classList.remove('active'));
                selectedPin = val;
            } else {
                pinBtns[0].classList.add('active');
                selectedPin = pinBtns[0].getAttribute('data-pin');
            }
        });

        // Convert & Kompres Gambar ke Base64
        const imageInput = document.getElementById('imageInput');
        const imgPreview = document.getElementById('imgPreview');

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxDim = 400;
                        let width = img.width;
                        let height = img.height;

                        if (width > height && width > maxDim) {
                            height *= maxDim / width;
                            width = maxDim;
                        } else if (height > maxDim) {
                            width *= maxDim / height;
                            height = maxDim;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);

                        imageBase64 = canvas.toDataURL('image/png');
                        imgPreview.src = imageBase64;
                        imgPreview.style.display = 'block';
                    };
                };
                reader.readAsDataURL(file);
            } else {
                imageBase64 = '';
                imgPreview.style.display = 'none';
            }
        });

        // Submit & Simpan ke Supabase
        const btnGenerate = document.getElementById('btnGenerate');
        const loadingText = document.getElementById('loadingText');
        const resultBox = document.getElementById('resultBox');
        const generatedLinkInput = document.getElementById('generatedLink');

        btnGenerate.addEventListener('click', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value.trim();
            const message = document.getElementById('message').value.trim();

            btnGenerate.disabled = true;
            loadingText.style.display = 'block';
            resultBox.style.display = 'none';

            try {
                // Gunakan supabaseClient
                const { data, error } = await supabaseClient
                    .from('letters')
                    .insert([
                        { 
                            title: title, 
                            message: message, 
                            color: selectedColor, 
                            pin: selectedPin, 
                            image: imageBase64 
                        }
                    ])
                    .select();

                if (error) throw error;

                if (data && data.length > 0) {
                    const currentPath = window.location.pathname;
                    const folderPath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
                    const baseUrl = window.location.origin + folderPath;
                    const finalUrl = `${baseUrl}surat.html?id=${data[0].id}`;
                    
                    generatedLinkInput.value = finalUrl;
                    resultBox.style.display = 'block';
                }
            } catch (err) {
                alert('Gagal membuat surat: ' + err.message);
            } finally {
                btnGenerate.disabled = false;
                loadingText.style.display = 'none';
            }
        });

        // Copy Link Button
        const btnCopy = document.getElementById('btnCopy');
        btnCopy.addEventListener('click', (e) => {
            e.preventDefault();
            generatedLinkInput.select();
            navigator.clipboard.writeText(generatedLinkInput.value);
            btnCopy.innerText = "Tersalin! ✔️";
            setTimeout(() => {
                btnCopy.innerText = "Salin Link";
            }, 2000);
        });

        // Copy Link Button
        const btnCopy = document.getElementById('btnCopy');
        btnCopy.addEventListener('click', (e) => {
            e.preventDefault();
            generatedLinkInput.select();
            navigator.clipboard.writeText(generatedLinkInput.value);
            btnCopy.innerText = "Tersalin! ✔️";
            setTimeout(() => {
                btnCopy.innerText = "Salin Link";
            }, 2000);
        });
    </script>
</body>
</html>
